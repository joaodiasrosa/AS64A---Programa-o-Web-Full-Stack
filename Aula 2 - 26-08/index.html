<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>
        Selecione um radio button e clique em enviar
    </p>
    <p>Genero:</p>
    <input type="radio" name="gender" value="Masculino">Masculino
    <input type="radio" name="gender" value="Feminino">Feminino
    <input type="radio" name="gender" value="Outro">Outro
    <p></p>
    <button type="button" onclick="displayRadioValue()">
        Enviar
    </button>
    <div id="result"></div>

    <script>
        function displayRadioValue(){
            var elemento = document.getElementsByName('gender')

            for(i=0; i < elemento.length; i++) {
                if (elemento[i].checked)
                document.getElementById("result").innerHTML
                        ="Genero: "+elemento[i].value;
            }
        }
    </script>
</body>
</html>
