<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Document</title>
</head>
<body>
    <div class="container mt-5">

        <h1 class="text-success text-center">Formulario Notas</h1>

        <h2 class="mt-4">Nome:</h2>
            <div class="mb-3">
                <input type="text" class="form-control" id="formGroupExampleInput" >
            </div>

        <h2>Insira suas notas:</h2>
            <div class="row g-3">
                <div class="col">
                    <input type="text" class="form-control" placeholder="Nota 1" aria-label="Nota 1">
                </div>
                <div class="col">
                    <input type="text" class="form-control" placeholder="Nota 2" aria-label="Last name">
                </div>
                <div class="col">
                    <input type="text" class="form-control" placeholder="Nota 3" aria-label="Last name">
                </div>
                <div class="col">
                    <input type="text" class="form-control" placeholder="Nota 4" aria-label="Last name">
                </div>
            </div>
        
        <button type="button" class="btn btn-outline-success mt-3 col-2 center " >Enviar</button>

    </div>

    

</body>
</html>
