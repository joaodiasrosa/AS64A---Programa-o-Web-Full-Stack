<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <title>Consulta CEP</title>
</head>

<body>

    <div class="container mt-5">

        <h1 class="text-success">Informe o CEP</h1>

        <h2 class="mt-4">Formulario</h2>

        <form method="get" action="." class="mt-4">

            <div class="mb-3">
                <label for="cep" class="form-label">CEP:</label>
                <input type="text" id="cep" class="form-control w-25">
            </div>

            <div class="mb-3">
                <label for="rua" class="form-label">Rua:</label>
                <input type="text" id="rua" class="form-control">
            </div>

            <div class="mb-3">
                <label for="bairro" class="form-label">Bairro:</label>
                <input type="text" id="bairro" class="form-control">
            </div>

            <div class="mb-3">
                <label for="cidade" class="form-label">Cidade:</label>
                <input type="text" id="cidade" class="form-control">
            </div>

            <div class="mb-3">
                <label for="estado" class="form-label">Estado:</label>
                <input type="text" id="estado" class="form-control w-25">
            </div>

            <div class="mb-3">
                <label for="ibge" class="form-label">IBGE:</label>
                <input type="text" id="ibge" class="form-control w-25">
            </div>

        </form>

    </div>


    <script>

        const cep = document.querySelector("#cep");
        const rua = document.querySelector("#rua");
        const bairro = document.querySelector("#bairro");
        const cidade = document.querySelector("#cidade");
        const estado = document.querySelector("#estado");
        const ibge = document.querySelector("#ibge");


        cep.addEventListener("change", function () {

            fetch("https://viacep.com.br/ws/" + cep.value + "/json/")
                .then(function (resposta) {
                    return resposta.json();
                })
                .then(function (dados) {

                    if (dados.erro) {
                        alert("CEP não encontrado");
                    } else {
                        rua.value = dados.logradouro;
                        bairro.value = dados.bairro;
                        cidade.value = dados.localidade;
                        estado.value = dados.uf;
                        ibge.value = dados.ibge;
                    }

                });

        });

    </script>

</body>

</html>
