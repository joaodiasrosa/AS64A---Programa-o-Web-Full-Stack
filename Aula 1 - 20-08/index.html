<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    <div>
        <div class="container-flute text-center">
            <div class="row">
                <div class="col bg-primary text-white p-3">
                    <h1>
                        Formulário consumindo API - CEP
                    </h1>
                </div>
            </div>
            <div class="row m-3">
                <div class="col-3"></div>
                <div class="col-6 border">
                    <h2>
                        Formulário
                    </h2>
                    <form action="" method="get">
                        <div class="mb-3">
                            <label for="cep" class="form-label">CEP:</label>
                            <input type="text" class="form-control" name="cep">
                        </div>
                        <div class="row g-3">
                            <div class="col-9">
                                <input type="text" class="form-control" placeholder="Rua" aria-label="First name ">
                            </div>
                            <div class="col">
                                <input type="text" class="form-control" placeholder="Número" aria-label="Last name">
                            </div>
                            </div>
                        
                        <input type="submit" value="Enviar" class="btn btn-success m-3">
                    </form>
                </div>
                <div class="col-3"></div>
            </div>
        </div>
    </div>
</body>
</html>
